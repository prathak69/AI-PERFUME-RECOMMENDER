<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#181a24" />
      <stop offset="70%" stop-color="#0c0d14" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>

    <!-- 24K Luxury Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc5" />
      <stop offset="25%" stop-color="#e2bf65" />
      <stop offset="50%" stop-color="#b88a38" />
      <stop offset="75%" stop-color="#f5e0a3" />
      <stop offset="100%" stop-color="#936c24" />
    </linearGradient>

    <!-- Liquid Scent Amber Gradient -->
    <linearGradient id="amberScent" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffdf79" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8a5c12" stop-opacity="0.95" />
    </linearGradient>

    <!-- Crystal Flacon Glass Tint -->
    <linearGradient id="crystalGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#c4d5ea" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#d4af37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25" />
    </linearGradient>

    <!-- Aura Scent Glow -->
    <radialGradient id="auraGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Shimmer Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle Shield with Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldMetallic)" stroke-width="1.8" />

  <!-- Inner Subtle Aura Ambient Glow -->
  <circle cx="32" cy="36" r="22" fill="url(#auraGlow)" />

  <!-- Fragrance Flacon Group -->
  <g id="perfume-flacon">
    <!-- Atomizer Stopper Gem (Emerald Cut) -->
    <!-- Stopper Base Shadow -->
    <path d="M 27 15 L 30 11 L 34 11 L 37 15 L 35 18 L 29 18 Z" fill="url(#goldMetallic)" />
    <!-- Stopper Top Facet Highlight -->
    <polygon points="30,11 34,11 35,14 29,14" fill="#fffdf2" fill-opacity="0.6" />

    <!-- Atomizer Neck Collar -->
    <rect x="29.5" y="18" width="5" height="4" rx="0.8" fill="url(#goldMetallic)" stroke="#694b12" stroke-width="0.3" />
    <!-- Neck Ribbon / Ring Accent -->
    <line x1="29.5" y1="20" x2="34.5" y2="20" stroke="#fff" stroke-width="0.6" stroke-opacity="0.8" />

    <!-- Bottle Crystal Outer Body -->
    <path d="M 27.5 22 L 36.5 22 L 43.5 27 L 45 32 L 45 49 L 41.5 54 L 22.5 54 L 19 49 L 19 32 L 20.5 27 Z"
          fill="url(#crystalGlass)"
          stroke="url(#goldMetallic)"
          stroke-width="1.5"
          stroke-linejoin="round" />

    <!-- Liquid Chamber Inside Bottle -->
    <path d="M 21.5 32.5 L 42.5 32.5 L 43 47.5 L 40 51.5 L 24 51.5 L 21 47.5 Z"
          fill="url(#amberScent)" />

    <!-- Liquid Surface Meniscus Line -->
    <ellipse cx="32" cy="32.5" rx="10.5" ry="1.2" fill="#fff" fill-opacity="0.65" />

    <!-- Central Haute Parfumerie Emblem Label -->
    <rect x="26.5" y="36.5" width="11" height="11" rx="2" fill="#08090d" stroke="url(#goldMetallic)" stroke-width="0.9" />
    <!-- Monogram "A" inside label -->
    <path d="M 32 38.2 L 29.2 44.8 L 30.7 44.8 L 31.4 43.1 L 32.6 43.1 L 33.3 44.8 L 34.8 44.8 Z M 32 40.2 L 32.3 41.8 L 31.7 41.8 Z"
          fill="url(#goldMetallic)" />

    <!-- Left Crystal Reflection Highlight Stripe -->
    <path d="M 21.5 28 L 23 28 L 22 48 L 20.5 48 Z" fill="#ffffff" fill-opacity="0.35" />

    <!-- Right Crystal Corner Micro-Facet -->
    <path d="M 42.5 28 L 44 32 L 44 48 L 43 48 Z" fill="#ffffff" fill-opacity="0.2" />

    <!-- Radiant Crystal Sparkle (Diamond Star at Shoulder) -->
    <!-- Main 4-point star -->
    <path d="M 45 19 Q 45 23 41 23 Q 45 23 45 27 Q 45 23 49 23 Q 45 23 45 19 Z"
          fill="#ffffff"
          filter="url(#goldGlow)" />
    <circle cx="45" cy="23" r="1.2" fill="#faecc5" />

    <!-- Secondary Micro Sparkle -->
    <circle cx="18" cy="24" r="0.9" fill="#faecc5" opacity="0.9" />
    <circle cx="48" cy="40" r="0.7" fill="#faecc5" opacity="0.8" />
  </g>
</svg>
