<div class="auth-page-container">
  <div class="auth-card luxury-glass-card">
    <div class="auth-header">
      <span class="luxury-badge">BECOME AN ATELIER MEMBER</span>
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">
        Join AURA to curate your personal fragrance wardrobe and receive climate-adaptive
        recommendations.
      </p>
    </div>

    <form [formGroup]="registrationForm" (ngSubmit)="register()" class="luxury-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          formControlName="name"
          name="name"
          id="name"
          placeholder="Jean-Paul Laurent"
          class="luxury-input"
        />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          formControlName="email"
          name="email"
          id="email"
          placeholder="curator@parfumerie.com"
          class="luxury-input"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          formControlName="password"
          name="password"
          id="password"
          placeholder="••••••••••••"
          class="luxury-input"
        />
      </div>

      <button
        type="submit"
        class="btn-luxury-primary btn-auth-submit"
        [disabled]="registrationForm.invalid"
      >
        <span>Create Atelier Account</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already a member? <a routerLink="/auth/login" class="auth-switch-link">Sign In</a></p>
    </div>
  </div>
</div>
