<p>inventory works!</p>

<ul>
  @for (perfume of perfumes(); track perfume.id || perfume.name + perfume.brand) {
    <li style="margin-bottom: 12px; display: flex; align-items: center; gap: 12px">
      <img
        [src]="
          perfume.image_url ||
          'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=800&q=80'
        "
        [alt]="perfume.name"
        style="
          width: 54px;
          height: 54px;
          object-fit: contain;
          border-radius: 8px;
          border: 1px solid #ddd;
          background: #fafafa;
          padding: 3px;
        "
      />
      <a [routerLink]="['/perfume', perfume.id]" style="font-size: 1.05rem; font-weight: 500">
        {{ perfume.name | titlecase }} by {{ perfume.brand | titlecase }}
      </a>
      <button (click)="deletePerfume(perfume.id)">delete</button>
    </li>
  }
</ul>

<form [formGroup]="perfumeForm">
  <label for="name">Name: </label>
  <input type="text" formControlName="name" placeholder="Perfume Name" id="name" /><br />
  <label for="brand">Brand: </label>
  <input type="text" formControlName="brand" placeholder="Brand" id="brand" /><br />
  <button type="submit" (click)="onSubmit()" [disabled]="isSubmitting() || perfumeForm.invalid">
    @if (isSubmitting()) {
      <span>Adding perfume..</span>
    } @else {
      <span>Add Perfume</span>
    }
  </button>
</form>

@if (errorMessage()) {
  <h5 style="color: red">{{ errorMessage() }}</h5>
}
